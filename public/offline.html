<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sin conexión · Flota Fulcrum</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
      }
      h1 { margin: 0 0 12px; font-size: 1.6rem; }
      p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 18px;
        background: #0f766e;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>Necesitas conexión a Internet para consultar los datos actualizados de la flota.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
